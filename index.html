<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iFly - 飞行记录</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:,">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.157.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.157.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="app-container">
    <!-- 左侧：3D地球 -->
    <div class="globe-panel">
      <div id="globe-container"></div>
    </div>

    <!-- 右侧面板 + 切换按钮容器 -->
    <div class="panel-wrapper">
      <button class="panel-toggle" id="panel-toggle" title="隐藏面板">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>

      <div class="right-panel">
      <div class="side-panel glass">
        <!-- 标题栏（固定） -->
        <div class="panel-header">
          <h2>飞行历史</h2>
          <span class="subtitle">FLIGHT HISTORY</span>
          <button class="daynight-toggle" id="daynight-toggle" title="全亮模式">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5"/>
              <line x1="12" y1="1" x2="12" y2="3"/>
              <line x1="12" y1="21" x2="12" y2="23"/>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
              <line x1="1" y1="12" x2="3" y2="12"/>
              <line x1="21" y1="12" x2="23" y2="12"/>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
            </svg>
          </button>
          <button class="daynight-toggle" id="rotate-toggle" title="自动转动">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="23 4 23 10 17 10"/>
              <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
            </svg>
          </button>
        </div>

        <!-- 历史内容（可滚动） -->
        <div class="history-scroll" id="history-scroll">
          <div class="history-empty">暂无飞行记录</div>
        </div>

        <!-- 记录航班按钮（固定） -->
        <button class="add-flight-btn" id="add-flight-btn" title="记录新航班">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          <span>记录航班</span>
        </button>
      </div>
    </div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
